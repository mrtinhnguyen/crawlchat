name: crawlchat-hdnd-ankhanh

services:
  front:
    image: ghcr.io/crawlchat/crawlchat-front:latest
    networks:
      - hdnd-ankhanh-net
    depends_on:
      - database
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      SELF_HOSTED: "true"
      DATABASE_URL: "mongodb://database:27017/crawlchat_hdnd_ankhanh?replicaSet=rs0"
      JWT_SECRET: "hdnd-ankhanh-secure-jwt-secret-change-this-in-production-min-32-chars"
      VITE_APP_URL: "https://chat.hanoi.vn"
      VITE_SERVER_WS_URL: "wss://api.chat.hanoi.vn"
      VITE_SERVER_URL: "https://api.chat.hanoi.vn"
      VITE_SOURCE_SYNC_URL: "https://sync.chat.hanoi.vn"
      VITE_GITHUB_APP_INSTALL_URL: ""
      DEFAULT_SIGNUP_PLAN_ID: "free"
      MARKER_HOST: "http://marker:80"
      MARKER_API_KEY: "hdnd-ankhanh-marker-api-key"
      VITE_BRAND_NAME: "Hội đồng nhân dân Quận An Khánh"
      VITE_BRAND_SLUG: "hdnd-ankhanh"
      VITE_PRIMARY_COLOR: "#DC2626"
      # optional
      RESEND_FROM_EMAIL: "noreply@hanoi.vn"
      RESEND_KEY: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: "https://chat.hanoi.vn/auth/google/callback"
      ADMIN_EMAILS: ""
    restart: unless-stopped

  server:
    image: ghcr.io/crawlchat/crawlchat-server:latest
    networks:
      - hdnd-ankhanh-net
    depends_on:
      - database
      - pgvector
    ports:
      - "127.0.0.1:3102:3000"
    environment:
      SELF_HOSTED: "true"
      DATABASE_URL: "mongodb://database:27017/crawlchat_hdnd_ankhanh?replicaSet=rs0"
      JWT_SECRET: "hdnd-ankhanh-secure-jwt-secret-change-this-in-production-min-32-chars"
      SOURCE_SYNC_URL: "http://source_sync:3000"
      PGVECTOR_URL: "postgresql://postgres:hdnd_ankhanh@pgvector:5432/crawlchat_hdnd_ankhanh"
      # AI/LLM - chọn 1 trong các options sau (uncomment để sử dụng)
      # OPENROUTER_API_KEY: "<OPENROUTER_API_KEY>"
      OPENAI_API_KEY: "<OPENAI_API_KEY>"
      # GEMINI_API_KEY: "<GEMINI_API_KEY>"
      # ANTHROPIC_API_KEY: "<ANTHROPIC_API_KEY>"
      # optional
      ADMIN_EMAILS: ""
    restart: unless-stopped

  source_sync:
    image: ghcr.io/crawlchat/crawlchat-source-sync:latest
    depends_on:
      - redis
      - database
      - pgvector
    ports:
      - "127.0.0.1:3103:3000"
    networks:
      - hdnd-ankhanh-net
    environment:
      SELF_HOSTED: "true"
      DATABASE_URL: "mongodb://database:27017/crawlchat_hdnd_ankhanh?replicaSet=rs0"
      JWT_SECRET: "hdnd-ankhanh-secure-jwt-secret-change-this-in-production-min-32-chars"
      PGVECTOR_URL: "postgresql://postgres:hdnd_ankhanh@pgvector:5432/crawlchat_hdnd_ankhanh"
      REDIS_URL: "redis://redis:6379"
      GROUP_QUEUE_NAME: "hdnd_ankhanh_groups"
      ITEM_QUEUE_NAME: "hdnd_ankhanh_items"
    restart: unless-stopped

  marker:
    image: ghcr.io/crawlchat/crawlchat-marker:latest
    depends_on:
      - database
    ports:
      - "127.0.0.1:3105:80"
    networks:
      - hdnd-ankhanh-net
    environment:
      API_KEY: "hdnd-ankhanh-marker-api-key"
    restart: unless-stopped

  database:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--noauth"]
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - hdnd_ankhanh_mongo_data:/data/db
    networks:
      - hdnd-ankhanh-net

  mongo-init:
    image: mongo:7
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c", "
      until mongosh --host database:27017 --eval 'db.runCommand({ ping: 1 })'; do
      echo 'Waiting for Mongo...'; sleep 2;
      done;
      mongosh --host database:27017 --eval 'rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"database:27017\"}]})'
      "]
    networks:
      - hdnd-ankhanh-net

  redis:
    image: redis:7
    container_name: hdnd-ankhanh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 12
    volumes:
      - hdnd_ankhanh_redis_data:/data
    networks:
      - hdnd-ankhanh-net

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hdnd_ankhanh
      POSTGRES_DB: crawlchat_hdnd_ankhanh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 2s
      retries: 5
    volumes:
      - hdnd_ankhanh_pgvector_data:/var/lib/postgresql/data
    networks:
      - hdnd-ankhanh-net

networks:
  hdnd-ankhanh-net:
    driver: bridge

volumes:
  hdnd_ankhanh_mongo_data:
  hdnd_ankhanh_redis_data:
  hdnd_ankhanh_pgvector_data:
